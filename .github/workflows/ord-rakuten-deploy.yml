name: ORDLUME Rakuten Utility Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ord-rakuten/**
      - .github/workflows/ord-rakuten-deploy.yml

permissions:
  contents: read

concurrency:
  group: ord-rakuten-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site
        run: |
          set -euo pipefail
          test -s ord-rakuten/index.html
          grep -q "ORDLUME" ord-rakuten/index.html
          grep -q "ord-rakuten.pages.dev" ord-rakuten/index.html

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Create project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create ord-rakuten --production-branch=main || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy ord-rakuten --project-name=ord-rakuten --branch=main --commit-dirty=true

      - name: Verify production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --max-time 20 https://ord-rakuten.pages.dev/ -o /tmp/ord-rakuten.html && grep -q "ORDLUME" /tmp/ord-rakuten.html; then
              echo "ORD_RAKUTEN_QA=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Production verification failed"
          exit 1
