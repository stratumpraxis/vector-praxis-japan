name: GWR UI Level 7 Hotfix

on:
  push:
    branches:
      - incubator/global-work-radar
    paths:
      - .github/workflows/gwr-ui-level7-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incubator/global-work-radar
      - name: Patch GWR Level 7 interaction wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('incubator/global-work-radar/index.html')
          text = path.read_text()
          text = text.replace('<body>', '<body id="top">', 1)
          old = '<a id="heroTopOpportunity" class="hero-action secondary official-apply" href="#signals" target="_blank" rel="noopener noreferrer" hidden>'
          new = '<a id="heroTopOpportunity" class="hero-action secondary official-apply" href="#signals" target="_blank" rel="noopener noreferrer" hidden onclick="if(typeof trackOfficialApply===\'function\')trackOfficialApply(this,\'hero_top_opportunity\')">'
          if old not in text:
              raise SystemExit('hero opportunity anchor pattern not found')
          text = text.replace(old, new, 1)
          old = "const heroJobs=document.getElementById('heroJobsCta');heroJobs?.addEventListener('click',event=>{event.preventDefault();document.getElementById('jobs')?.scrollIntoView({behavior:reduced?'auto':'smooth'});document.getElementById('keyword')?.focus({preventScroll:true})});"
          new = "const heroJobs=document.getElementById('heroJobsCta');heroJobs?.addEventListener('click',event=>{event.preventDefault();const button=document.getElementById('searchButton');if(button)button.click();else document.getElementById('jobs')?.scrollIntoView({behavior:reduced?'auto':'smooth'});document.getElementById('keyword')?.focus({preventScroll:true})});"
          if old not in text:
              raise SystemExit('hero jobs handler pattern not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit hotfix
        run: |
          git config user.name gwr-ui-bot
          git config user.email gwr-ui-bot@users.noreply.github.com
          git add incubator/global-work-radar/index.html
          git diff --cached --check
          git commit -m "fix(gwr): restore hero apply analytics and top navigation"
          git push origin HEAD:incubator/global-work-radar
