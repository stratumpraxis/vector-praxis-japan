name: OrdLume Rakuten Cloudflare Deploy

on:
  push:
    branches:
      - ordlume/rakuten-tool
    paths:
      - ordlume-rakuten/**
      - .github/workflows/ordlume-rakuten-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordlume-rakuten-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout OrdLume Rakuten branch
        uses: actions/checkout@v4
        with:
          ref: ordlume/rakuten-tool

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create ordlume-rakuten --production-branch=main || true

      - name: Deploy production bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ordlume-rakuten \
            --project-name=ordlume-rakuten \
            --branch=main \
            --commit-dirty=true

      - name: Verify production
        run: |
          set -euo pipefail
          URL='https://ordlume-rakuten.pages.dev/'
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --max-time 30 "$URL" -o /tmp/ordlume-rakuten.html; then break; fi
            if [ "$attempt" = "8" ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          grep -q 'ORDLUME' /tmp/ordlume-rakuten.html
          grep -q '楽天商品紹介ツール' /tmp/ordlume-rakuten.html
          grep -q 'ordlume-rakuten.pages.dev' /tmp/ordlume-rakuten.html
          if grep -qi 'Stratum Praxis' /tmp/ordlume-rakuten.html; then
            echo 'Cross-brand contamination detected'
            exit 1
          fi
          if grep -qi 'Global Work Radar' /tmp/ordlume-rakuten.html; then
            echo 'Cross-brand contamination detected'
            exit 1
          fi
          echo 'ORDLUME_RAKUTEN_QA=PASS'
