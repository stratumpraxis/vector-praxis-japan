name: Vector Bluesky Buyer Match

on:
  push:
    paths:
      - 'distribution/bluesky-buyer-match-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover Japanese buyer-match candidates
        run: node scripts/bluesky-buyer-match.mjs
      - name: Persist buyer-match evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/bluesky-buyer-match-latest.json
          if git diff --cached --quiet; then
            echo "No buyer-match evidence change."
            exit 0
          fi
          git commit -m "chore: persist Vector Bluesky buyer-match evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
