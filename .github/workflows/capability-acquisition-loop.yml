name: Capability Acquisition Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "10 23 * * *" # 08:10 JST

permissions:
  contents: write

concurrency:
  group: capability-acquisition-loop
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regression tests
        run: node --test tests/capability-scoring.test.mjs

      - name: Scan external capability signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/capability-scan.mjs

      - name: Persist evidence outside Actions retention
        shell: bash
        run: |
          if git diff --quiet -- capability-lab/evidence capability-lab/queue.md; then
            echo "No capability evidence changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capability-lab/evidence capability-lab/queue.md
          git commit -m "chore(capability-lab): persist daily external scan evidence"
          git push
