name: GWR Cloudflare Deploy

on:
  push:
    branches:
      - incubator/global-work-radar
    paths:
      - incubator/global-work-radar/index.html
      - incubator/global-work-radar/styles.css
      - incubator/global-work-radar/app.js
      - incubator/global-work-radar/data/verified-jobs.json
      - incubator/global-work-radar/data/workable-market.json
      - .github/workflows/gwr-cloudflare-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gwr-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare readiness
        id: auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: credentials are not configured yet."
          fi

      - name: Checkout GWR branch
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: incubator/global-work-radar

      - name: Build public-only bundle
        if: steps.auth.outputs.ready == 'true'
        run: |
          rm -rf /tmp/gwr-public
          mkdir -p /tmp/gwr-public/data
          cp incubator/global-work-radar/index.html /tmp/gwr-public/
          cp incubator/global-work-radar/styles.css /tmp/gwr-public/
          cp incubator/global-work-radar/app.js /tmp/gwr-public/
          cp incubator/global-work-radar/data/verified-jobs.json /tmp/gwr-public/data/
          cp incubator/global-work-radar/data/workable-market.json /tmp/gwr-public/data/
          printf '%s\n' '/* /index.html 200' > /tmp/gwr-public/_redirects

      - name: Create Cloudflare Pages project if needed
        if: steps.auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create global-work-radar --production-branch=incubator/global-work-radar || true

      - name: Deploy to Cloudflare Pages
        if: steps.auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy /tmp/gwr-public \
            --project-name=global-work-radar \
            --branch=incubator/global-work-radar \
            --commit-dirty=true
