name: GWR Cloudflare Deploy

on:
  push:
    branches:
      - incubator/global-work-radar
    paths:
      - incubator/global-work-radar/index.html
      - incubator/global-work-radar/styles.css
      - incubator/global-work-radar/app.js
      - incubator/global-work-radar/revenue-config.js
      - incubator/global-work-radar/favicon.svg
      - incubator/global-work-radar/robots.txt
      - incubator/global-work-radar/sitemap.xml
      - incubator/global-work-radar/d3af1ce8e69e0a9f87870bc03e522daf.txt
      - incubator/global-work-radar/data/verified-jobs.json
      - incubator/global-work-radar/data/workable-market.json
      - .github/workflows/gwr-cloudflare-deploy.yml
  workflow_run:
    workflows:
      - GWR Workable Snapshot
    types:
      - completed
    branches:
      - incubator/global-work-radar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gwr-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deploy blocked: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
          echo "Cloudflare credentials detected."

      - name: Checkout GWR branch
        uses: actions/checkout@v4
        with:
          ref: incubator/global-work-radar

      - name: Build public-only bundle
        run: |
          rm -rf /tmp/gwr-public
          mkdir -p /tmp/gwr-public/data
          cp incubator/global-work-radar/index.html /tmp/gwr-public/
          cp incubator/global-work-radar/styles.css /tmp/gwr-public/
          cp incubator/global-work-radar/app.js /tmp/gwr-public/
          cp incubator/global-work-radar/revenue-config.js /tmp/gwr-public/
          cp incubator/global-work-radar/favicon.svg /tmp/gwr-public/
          cp incubator/global-work-radar/robots.txt /tmp/gwr-public/
          cp incubator/global-work-radar/sitemap.xml /tmp/gwr-public/
          cp incubator/global-work-radar/d3af1ce8e69e0a9f87870bc03e522daf.txt /tmp/gwr-public/
          cp incubator/global-work-radar/data/verified-jobs.json /tmp/gwr-public/data/
          cp incubator/global-work-radar/data/workable-market.json /tmp/gwr-public/data/
          printf '%s\n' '/* /index.html 200' > /tmp/gwr-public/_redirects

      - name: Create Cloudflare Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create global-work-radar --production-branch=incubator/global-work-radar || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy /tmp/gwr-public \
            --project-name=global-work-radar \
            --branch=incubator/global-work-radar \
            --commit-dirty=true

      - name: Live production QA
        env:
          GWR_URL: https://global-work-radar.pages.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/" -o /tmp/gwr-live.html; then break; fi
            if [ "$attempt" = "8" ]; then echo "Production page unavailable after retries"; exit 1; fi
            sleep $((attempt * 2))
          done
          grep -q "日本から応募できる海外リモート求人" /tmp/gwr-live.html
          grep -q 'rel="canonical" href="https://global-work-radar.pages.dev/"' /tmp/gwr-live.html
          grep -q 'id="jobsList"' /tmp/gwr-live.html
          grep -q 'src="./app.js"' /tmp/gwr-live.html
          grep -q 'src="./revenue-config.js"' /tmp/gwr-live.html
          grep -q 'href="./favicon.svg"' /tmp/gwr-live.html
          curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/favicon.svg" -o /tmp/gwr-live-favicon.svg
          grep -q '<svg' /tmp/gwr-live-favicon.svg
          curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/robots.txt" -o /tmp/gwr-live-robots.txt
          curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/sitemap.xml" -o /tmp/gwr-live-sitemap.xml
          grep -q 'Sitemap: https://global-work-radar.pages.dev/sitemap.xml' /tmp/gwr-live-robots.txt
          grep -q '<loc>https://global-work-radar.pages.dev/</loc>' /tmp/gwr-live-sitemap.xml
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/d3af1ce8e69e0a9f87870bc03e522daf.txt" -o /tmp/gwr-live-indexnow-key.txt \
              && grep -q '^d3af1ce8e69e0a9f87870bc03e522daf$' /tmp/gwr-live-indexnow-key.txt; then
              break
            fi
            if [ "$attempt" = "8" ]; then echo "IndexNow key unavailable on production alias after retries"; exit 1; fi
            sleep $((attempt * 2))
          done
          curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/data/verified-jobs.json" -o /tmp/gwr-live-jobs.json
          curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/app.js" -o /tmp/gwr-live-app.js
          curl --fail --location --silent --show-error --max-time 30 "$GWR_URL/revenue-config.js" -o /tmp/gwr-live-revenue-config.js
          grep -q "gwr_search" /tmp/gwr-live-app.js
          grep -q "gwr_official_apply_click" /tmp/gwr-live-app.js
          grep -q "gwr_jobs_section_view" /tmp/gwr-live-revenue-config.js
          grep -q "gwr_job_card_view" /tmp/gwr-live-revenue-config.js
          grep -q "CARD_TO_APPLY" /tmp/gwr-live-revenue-config.js
          node - <<'NODE'
          const p=require('/tmp/gwr-live-jobs.json'); if(!p.records?.length) throw new Error('No jobs'); console.log(`GWR_LIVE_JOB_COUNT=${p.records.length}`)
          NODE
          echo "GWR_PRODUCTION_URL=$GWR_URL/"
          echo "GWR_LIVE_QA=PASS"

      - name: Notify IndexNow of GWR update
        continue-on-error: true
        env:
          GWR_URL: https://global-work-radar.pages.dev
          INDEXNOW_KEY: d3af1ce8e69e0a9f87870bc03e522daf
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            --output /tmp/gwr-indexnow-response.txt \
            --write-out '%{http_code}' \
            --request POST 'https://api.indexnow.org/IndexNow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "{\"host\":\"global-work-radar.pages.dev\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"${GWR_URL}/${INDEXNOW_KEY}.txt\",\"urlList\":[\"${GWR_URL}/\"]}")
          echo "GWR_INDEXNOW_HTTP=$HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            cat /tmp/gwr-indexnow-response.txt || true
            exit 1
          fi
          echo "GWR_INDEXNOW_SUBMITTED=1"

      - name: Verify live PostHog interaction events
        env:
          GWR_URL: https://global-work-radar.pages.dev
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            let posthogPosts = 0;
            let sawSearch = false;
            let sawOfficialApply = false;
            page.on('console', msg => console.log(`BROWSER_CONSOLE ${msg.type()} ${msg.text()}`));
            page.on('request', req => {
              if (/posthog|\/e\/|\/batch\//i.test(req.url())) {
                const body = req.postData() || '';
                console.log(`POSTHOG_REQUEST ${req.method()} ${req.url()} ${body.slice(0,1600)}`);
                if (req.method() === 'POST') {
                  posthogPosts++;
                  if (body.includes('gwr_search')) sawSearch = true;
                  if (body.includes('gwr_official_apply_click')) sawOfficialApply = true;
                }
              }
            });
            page.on('response', res => {
              if (/posthog|\/e\/|\/batch\//i.test(res.url())) console.log(`POSTHOG_RESPONSE ${res.status()} ${res.url()}`);
            });
            await page.goto(`${process.env.GWR_URL}/?gwr_qa=1`, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.posthog && typeof window.posthog.capture === 'function');
            await page.evaluate(() => {
              window.posthog.register({ gwr_qa: true, gwr_qa_source: 'github_actions_live' });
              window.__gwrQaCaptures = [];
              const original = window.posthog.capture.bind(window.posthog);
              window.posthog.capture = function(name, props, options) {
                window.__gwrQaCaptures.push(name);
                console.log(`CAPTURE_CALL ${name} ${JSON.stringify(props||{})}`);
                return original(name, props, options);
              };
            });
            await page.click('#searchButton');
            await page.waitForTimeout(2200);
            const firstApply = page.locator('.official-apply').first();
            await firstApply.waitFor({ state: 'visible' });
            const capturesBeforeApply = await page.evaluate(() => window.__gwrQaCaptures.slice());
            if (!capturesBeforeApply.includes('gwr_jobs_section_view')) throw new Error(`gwr_jobs_section_view capture missing: ${capturesBeforeApply.join(',')}`);
            if (!capturesBeforeApply.includes('gwr_job_card_view')) throw new Error(`gwr_job_card_view capture missing: ${capturesBeforeApply.join(',')}`);
            const [popup] = await Promise.all([
              page.waitForEvent('popup'),
              firstApply.click()
            ]);
            await popup.waitForLoadState('domcontentloaded', { timeout: 30000 }).catch(() => {});
            console.log(`GWR_OFFICIAL_OUTBOUND_URL=${popup.url()}`);
            if (!/^https:\/\//.test(popup.url()) || popup.url().includes('global-work-radar.pages.dev')) throw new Error(`Official outbound did not leave GWR: ${popup.url()}`);
            await popup.close();
            await page.waitForTimeout(4000);
            if (posthogPosts < 1) throw new Error('No PostHog POST request observed from production interactions');
            if (!sawSearch) throw new Error('gwr_search PostHog POST was not observed from live production interaction');
            if (!sawOfficialApply) throw new Error('gwr_official_apply_click PostHog POST was not observed from live production interaction');
            console.log(`GWR_POSTHOG_POSTS=${posthogPosts}`);
            console.log('GWR_JOBS_SECTION_CAPTURE_OBSERVED=1');
            console.log('GWR_JOB_CARD_CAPTURE_OBSERVED=1');
            console.log('GWR_SEARCH_POST_OBSERVED=1');
            console.log('GWR_OFFICIAL_APPLY_POST_OBSERVED=1');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
