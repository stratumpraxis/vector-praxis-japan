name: GWR World Work Data Overlay

on:
  push:
    branches:
      - incubator/global-work-radar
    paths:
      - incubator/global-work-radar/world-work-data.html
      - .github/workflows/gwr-world-work-data-overlay.yml
  workflow_run:
    workflows:
      - GWR Cloudflare Deploy
    types:
      - completed
    branches:
      - incubator/global-work-radar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gwr-world-work-data-overlay
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout GWR branch
        uses: actions/checkout@v4
        with:
          ref: incubator/global-work-radar

      - name: Build complete public GWR bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/gwr-public
          mkdir -p /tmp/gwr-public/data
          cp incubator/global-work-radar/index.html /tmp/gwr-public/
          cp incubator/global-work-radar/world-work-data.html /tmp/gwr-public/
          cp incubator/global-work-radar/styles.css /tmp/gwr-public/
          cp incubator/global-work-radar/app.js /tmp/gwr-public/
          cp incubator/global-work-radar/revenue-config.js /tmp/gwr-public/
          cp incubator/global-work-radar/favicon.svg /tmp/gwr-public/
          cp incubator/global-work-radar/robots.txt /tmp/gwr-public/
          cp incubator/global-work-radar/sitemap.xml /tmp/gwr-public/
          cp incubator/global-work-radar/d3af1ce8e69e0a9f87870bc03e522daf.txt /tmp/gwr-public/
          cp incubator/global-work-radar/data/verified-jobs.json /tmp/gwr-public/data/
          cp incubator/global-work-radar/data/workable-market.json /tmp/gwr-public/data/
          printf '%s\n' '/* /index.html 200' > /tmp/gwr-public/_redirects

      - name: Deploy complete GWR bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy /tmp/gwr-public \
            --project-name=global-work-radar \
            --branch=incubator/global-work-radar \
            --commit-dirty=true

      - name: Verify World Work Data production page
        run: |
          set -euo pipefail
          URL='https://global-work-radar.pages.dev/world-work-data.html'
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --max-time 30 "$URL" -o /tmp/world-work-data.html; then break; fi
            if [ "$attempt" = "8" ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          grep -q 'GLOBAL WORK RADAR' /tmp/world-work-data.html
          grep -q '世界の働き方' /tmp/world-work-data.html
          grep -q 'global-work-radar.pages.dev/world-work-data.html' /tmp/world-work-data.html
          if grep -qi 'Stratum Praxis' /tmp/world-work-data.html; then
            echo 'Cross-brand contamination detected'
            exit 1
          fi
          echo 'GWR_WORLD_WORK_DATA_QA=PASS'
