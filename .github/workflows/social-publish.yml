name: Social Publish Queue

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: vector-praxis-social-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish one due item
        env:
          SOCIAL_PUBLISH_WEBHOOK_URL: ${{ secrets.SOCIAL_PUBLISH_WEBHOOK_URL }}
        run: node scripts/social-queue.mjs
      - name: Persist confirmed publish state or publisher cooldown
        if: always()
        run: |
          if git diff --quiet -- distribution/social-queue.json; then
            echo "No social publish state to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/social-queue.json
          git commit -m "chore: record social publish state"
          git push
