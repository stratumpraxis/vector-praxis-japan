name: Social Publish Queue

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'distribution/social-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: vector-praxis-social-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare video build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow

      - name: Build and publish campaign media asset
        run: |
          if [ ! -f public/media/vector-praxis-completion-layer.mp4 ]; then
            python scripts/build-completion-layer-social-video.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/media/vector-praxis-completion-layer.mp4
            git commit -m "chore: publish Completion Layer social video"
            git push
          else
            echo "Campaign media already exists."
          fi

      - name: Publish approved due social items
        env:
          SOCIAL_PUBLISH_WEBHOOK_URL: ${{ secrets.SOCIAL_PUBLISH_WEBHOOK_URL }}
        run: node scripts/social-queue.mjs

      - name: Persist publish evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/social-queue.json
          if [ -f distribution/social-last-run.json ]; then
            git add distribution/social-last-run.json
          fi
          if git diff --cached --quiet; then
            echo "No publish state or evidence change to persist."
            exit 0
          fi
          git commit -m "chore: record social publish evidence"
          git push
