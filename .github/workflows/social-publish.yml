name: Social Publish Queue

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'distribution/social-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: vector-praxis-social-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare video build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow

      - name: Build campaign media if missing
        run: |
          if [ ! -f public/media/vector-praxis-completion-layer.mp4 ]; then
            python scripts/build-completion-layer-social-video.py
          else
            echo "Campaign media already exists."
          fi

      - name: Preflight direct social providers
        env:
          FEDICA_API_TOKEN: ${{ secrets.FEDICA_API_TOKEN || secrets.FEDICA_TOKEN }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN || secrets.METRICOOL_USER_TOKEN || secrets.METRICOOL_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY || secrets.PUBLER_TOKEN }}
          SOCIAL_PUBLISH_WEBHOOK_URL: ${{ secrets.SOCIAL_PUBLISH_WEBHOOK_URL }}
        run: node scripts/social-provider-preflight.mjs

      - name: Publish approved due social items
        env:
          SOCIAL_PUBLISH_WEBHOOK_URL: ${{ secrets.SOCIAL_PUBLISH_WEBHOOK_URL }}
        run: node scripts/social-queue.mjs

      - name: Persist media and evidence without losing concurrent updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/vector-praxis-completion-layer.mp4 2>/dev/null || true
          git add distribution/social-queue.json 2>/dev/null || true
          git add distribution/social-last-run.json 2>/dev/null || true
          git add distribution/social-provider-preflight.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No media/evidence change to persist."
            exit 0
          fi
          git commit -m "chore: persist social publish evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
