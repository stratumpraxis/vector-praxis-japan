name: Deploy AI Stack Optimizer to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "ai-stack-optimizer/**"
      - ".github/workflows/deploy-ai-stack-optimizer-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ai-stack-optimizer
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
