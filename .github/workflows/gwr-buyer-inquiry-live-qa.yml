name: GWR Buyer Inquiry Live QA

on:
  push:
    branches:
      - incubator/global-work-radar
    paths:
      - .github/workflows/gwr-buyer-inquiry-live-qa.yml

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify attributed buyer inquiry evidence on production
        env:
          GWR_URL: https://global-work-radar.pages.dev
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const url = `${process.env.GWR_URL}/?gwr_qa=1&gwr_buyer=jobasia&utm_source=qualified_buyer_exposure&utm_campaign=gwr_buyer_reaction_202609`;
            let ready = false;
            for (let attempt = 0; attempt < 12; attempt++) {
              await page.goto(url, { waitUntil: 'networkidle' });
              ready = await page.locator('.gwr-inquiry-option').count().then(n => n >= 3).catch(() => false);
              if (ready) break;
              await page.waitForTimeout(5000);
            }
            if (!ready) throw new Error('Buyer inquiry UI did not appear on production');
            await page.waitForFunction(() => window.posthog && typeof window.posthog.capture === 'function');
            await page.evaluate(() => {
              window.__gwrInquiryCaptures = [];
              const original = window.posthog.capture.bind(window.posthog);
              window.posthog.capture = function(name, props, options) {
                window.__gwrInquiryCaptures.push({ name, props: props || {} });
                return original(name, props, options);
              };
            });
            await page.locator('.gwr-reaction-option[data-reaction="hiring_decision"]').click();
            const step = page.locator('#gwrInquiryStep');
            await step.waitFor({ state: 'visible' });
            await page.locator('.gwr-inquiry-option[data-inquiry="paid_pilot"]').click();
            await page.waitForTimeout(1200);
            const status = await page.locator('#gwrInquiryStatus').innerText();
            if (!status.includes('Recovery evidence')) throw new Error(`Attributed recovery status missing: ${status}`);
            const captures = await page.evaluate(() => window.__gwrInquiryCaptures || []);
            const names = captures.map(x => x.name);
            if (!names.includes('gwr_buyer_inquiry')) throw new Error(`gwr_buyer_inquiry capture missing: ${names.join(',')}`);
            if (!names.includes('gwr_buyer_reaction_recovered')) throw new Error(`gwr_buyer_reaction_recovered capture missing: ${names.join(',')}`);
            if (!names.includes('gwr_paid_pilot_request')) throw new Error(`gwr_paid_pilot_request capture missing: ${names.join(',')}`);
            const inquiry = captures.find(x => x.name === 'gwr_buyer_inquiry');
            if (inquiry?.props?.buyer_key !== 'jobasia') throw new Error(`buyer attribution missing: ${JSON.stringify(inquiry?.props || {})}`);
            if (inquiry?.props?.recovery_qualified !== true) throw new Error('recovery_qualified was not true');
            if (inquiry?.props?.recovery_status !== 'explicit_inquiry') throw new Error(`unexpected recovery_status: ${inquiry?.props?.recovery_status}`);
            console.log('GWR_BUYER_INQUIRY_UI=PASS');
            console.log('GWR_ATTRIBUTED_RECOVERY=PASS');
            console.log('GWR_PAID_PILOT_EVENT=PASS');
            console.log('GWR_BUYER_IDENTITY=JOBASIA');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
