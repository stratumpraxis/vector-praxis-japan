name: GWR World Work Data Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - gwr-world-work-data/**
      - .github/workflows/gwr-world-work-data-deploy.yml

permissions:
  contents: read

concurrency:
  group: gwr-world-work-data-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site
        run: |
          set -euo pipefail
          test -s gwr-world-work-data/index.html
          grep -q "GLOBAL WORK RADAR" gwr-world-work-data/index.html
          grep -q "gwr-world-work-data.pages.dev" gwr-world-work-data/index.html

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Create project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create gwr-world-work-data --production-branch=main || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy gwr-world-work-data --project-name=gwr-world-work-data --branch=main --commit-dirty=true

      - name: Verify production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --max-time 20 https://gwr-world-work-data.pages.dev/ -o /tmp/gwr-world.html && grep -q "GLOBAL WORK RADAR" /tmp/gwr-world.html; then
              echo "GWR_WORLD_WORK_DATA_QA=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Production verification failed"
          exit 1
