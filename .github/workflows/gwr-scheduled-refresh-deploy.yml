name: GWR Canonical Production Deploy Bridge

on:
  schedule:
    - cron: '32 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gwr-scheduled-refresh-deploy.yml

permissions:
  contents: read

concurrency:
  group: gwr-canonical-production-deploy-bridge
  cancel-in-progress: true

jobs:
  deploy-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          echo "GWR_BRIDGE_CREDENTIALS=READY"

      - name: Checkout canonical GWR repository
        uses: actions/checkout@v4
        with:
          repository: globalworkradar/global-work-radar
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Build canonical public bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/gwr-public
          mkdir -p /tmp/gwr-public/data
          cp index.html /tmp/gwr-public/
          cp styles.css /tmp/gwr-public/
          cp app.js /tmp/gwr-public/
          printf '\n' >> /tmp/gwr-public/app.js
          cat measurement-contract.js >> /tmp/gwr-public/app.js
          cp revenue-config.js /tmp/gwr-public/
          cp favicon.svg /tmp/gwr-public/
          cp robots.txt /tmp/gwr-public/
          cp sitemap.xml /tmp/gwr-public/
          cp d3af1ce8e69e0a9f87870bc03e522daf.txt /tmp/gwr-public/
          cp data/verified-jobs.json /tmp/gwr-public/data/
          cp data/workable-market.json /tmp/gwr-public/data/
          printf '%s\n' '/* /index.html 200' > /tmp/gwr-public/_redirects
          node --check /tmp/gwr-public/app.js
          test -s /tmp/gwr-public/data/verified-jobs.json
          echo "GWR_CANONICAL_BUNDLE=PASS"

      - name: Resolve Cloudflare production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project create global-work-radar --production-branch=main || true
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/global-work-radar" \
            -o /tmp/gwr-pages-project.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/gwr-pages-project.json','utf8'));
          const branch=p?.result?.production_branch;
          if(!p?.success || !branch) throw new Error('Cloudflare production_branch unavailable');
          fs.appendFileSync(process.env.GITHUB_ENV, `GWR_CF_PRODUCTION_BRANCH=${branch}\n`);
          console.log(`GWR_CF_PRODUCTION_BRANCH=${branch}`);
          NODE

      - name: Deploy canonical bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy /tmp/gwr-public \
            --project-name=global-work-radar \
            --branch="${GWR_CF_PRODUCTION_BRANCH}" \
            --commit-dirty=true

      - name: Verify exact production artifact
        env:
          GWR_URL: https://global-work-radar.pages.dev
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const b=fs.readFileSync('/tmp/gwr-public/data/verified-jobs.json');
          const j=JSON.parse(b);
          if(!j.generated_at || !j.records?.length) throw new Error('Canonical artifact invalid');
          fs.writeFileSync('/tmp/gwr-expected.json', JSON.stringify({
            generated_at:j.generated_at,
            job_count:j.records.length,
            sha256:crypto.createHash('sha256').update(b).digest('hex')
          }));
          NODE
          for attempt in $(seq 1 16); do
            curl --fail --location --silent --show-error --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "${GWR_URL}/data/verified-jobs.json?bridge=${GITHUB_SHA}-${attempt}" \
              -o /tmp/gwr-live-jobs.json || true
            if node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const expected=JSON.parse(fs.readFileSync('/tmp/gwr-expected.json','utf8'));
          let raw;
          try { raw=fs.readFileSync('/tmp/gwr-live-jobs.json'); } catch { process.exit(1); }
          let live;
          try { live=JSON.parse(raw); } catch { process.exit(1); }
          const actual={
            generated_at:live.generated_at,
            job_count:Array.isArray(live.records)?live.records.length:null,
            sha256:crypto.createHash('sha256').update(raw).digest('hex')
          };
          console.log(`GWR_EXPECTED_GENERATED_AT=${expected.generated_at}`);
          console.log(`GWR_LIVE_GENERATED_AT=${actual.generated_at}`);
          console.log(`GWR_EXPECTED_JOB_COUNT=${expected.job_count}`);
          console.log(`GWR_LIVE_JOB_COUNT=${actual.job_count}`);
          console.log(`GWR_EXPECTED_SHA256=${expected.sha256}`);
          console.log(`GWR_LIVE_SHA256=${actual.sha256}`);
          if(actual.generated_at!==expected.generated_at || actual.job_count!==expected.job_count || actual.sha256!==expected.sha256) process.exit(1);
          NODE
            then
              echo "GWR_PRODUCTION_ARTIFACT_IDENTITY=PASS"
              break
            fi
            if [ "$attempt" = "16" ]; then
              echo "Canonical production alias failed to converge"
              exit 1
            fi
            sleep 5
          done

      - name: Live production QA
        env:
          GWR_URL: https://global-work-radar.pages.dev
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 "${GWR_URL}/" -o /tmp/gwr-live.html
          grep -q "日本から応募できる海外リモート求人" /tmp/gwr-live.html
          grep -q 'id="jobsList"' /tmp/gwr-live.html
          curl --fail --location --silent --show-error --max-time 30 "${GWR_URL}/app.js" -o /tmp/gwr-live-app.js
          grep -q "gwr_search" /tmp/gwr-live-app.js
          echo "GWR_LIVE_QA=PASS"
          echo "GWR_DEPLOY_BRIDGE=PASS"

      - name: Notify IndexNow
        continue-on-error: true
        env:
          GWR_URL: https://global-work-radar.pages.dev
          INDEXNOW_KEY: d3af1ce8e69e0a9f87870bc03e522daf
        run: |
          curl --silent --show-error --max-time 30 \
            --output /tmp/gwr-indexnow-response.txt \
            --write-out 'GWR_INDEXNOW_HTTP=%{http_code}\n' \
            --request POST 'https://api.indexnow.org/IndexNow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "{\"host\":\"global-work-radar.pages.dev\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"${GWR_URL}/${INDEXNOW_KEY}.txt\",\"urlList\":[\"${GWR_URL}/\"]}"
