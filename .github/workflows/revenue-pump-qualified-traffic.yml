name: Revenue Pump Qualified Traffic Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'distribution/revenue-pump-qualified-traffic.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: vector-revenue-pump-qualified-traffic
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish approved qualified traffic probe
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE || 'vectorpx.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PDS_URL: ${{ vars.BLUESKY_PDS_URL || 'https://bsky.social' }}
        run: node scripts/revenue-pump-qualified-traffic-probe.mjs

      - name: Persist qualified traffic evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/revenue-pump-qualified-traffic.json 2>/dev/null || true
          git add distribution/revenue-pump-qualified-traffic-last-run.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No qualified traffic evidence change to persist."
            exit 0
          fi
          git commit -m "chore: persist qualified traffic probe evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
