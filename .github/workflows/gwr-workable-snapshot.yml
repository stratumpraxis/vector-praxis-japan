name: GWR Workable Snapshot

on:
  push:
    branches:
      - incubator/global-work-radar
    paths:
      - incubator/global-work-radar/ingest-workable.mjs
      - incubator/global-work-radar/build-public-jobs.mjs
      - .github/workflows/gwr-workable-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gwr-workable-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GWR branch
        uses: actions/checkout@v4
        with:
          ref: incubator/global-work-radar
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ingest Workable
        run: node incubator/global-work-radar/ingest-workable.mjs

      - name: Build verified public jobs
        run: node incubator/global-work-radar/build-public-jobs.mjs

      - name: Validate outputs
        run: |
          node -e "const fs=require('fs'); for (const f of ['workable-current.json','workable-state.json','workable-market.json','verified-jobs.json']) JSON.parse(fs.readFileSync('incubator/global-work-radar/data/'+f,'utf8')); console.log('GWR JSON outputs valid')"

      - name: Commit snapshot evidence
        run: |
          git config user.name "gwr-bot"
          git config user.email "globalworkradar@gmail.com"
          git add incubator/global-work-radar/data/workable-current.json \
                  incubator/global-work-radar/data/workable-state.json \
                  incubator/global-work-radar/data/workable-history.jsonl \
                  incubator/global-work-radar/data/workable-market.json \
                  incubator/global-work-radar/data/verified-jobs.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "data(gwr): capture Workable market snapshot"
          git push origin HEAD:incubator/global-work-radar
