name: Vector Revenue Probe Publish

# Existing single-post direct Bluesky workflow; marker updated only to trigger this approved run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vector-revenue-probe-publish.yml'

permissions:
  contents: write

concurrency:
  group: vector-revenue-probe-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish one verified Vector revenue probe
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE || 'vectorpx.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PDS_URL: ${{ vars.BLUESKY_PDS_URL || 'https://bsky.social' }}
        run: node scripts/publish-vector-revenue-probe.mjs

      - name: Persist publisher evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/vector-revenue-probe-evidence.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No revenue-probe evidence change to persist."
            exit 0
          fi
          git commit -m "chore: persist Vector revenue probe evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
