name: YORUMACHI Live QA Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/yorumachi-live-qa-preview.yml

permissions:
  contents: read

concurrency:
  group: yorumachi-live-qa-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_NAME: yorumachi-live-qa
      LIVE_URL: https://yorumachi-live-qa.pages.dev
      EXPECTED_SHA256: cfcc91a5e15f2238fc0d382503f7e922642d51898ff1c3df79038581c360afcc

    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare credential bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_CREDENTIAL_BRIDGE=READY"

      - name: Materialize exact LIVE QA preview
        run: |
          set -euo pipefail
          rm -rf /tmp/yorumachi-live-qa
          mkdir -p /tmp/yorumachi-live-qa
          cat ops/yorumachi-live-qa/payload/part*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/yorumachi-live-qa/index.html
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/yorumachi-live-qa/index.html | sha256sum --check
          grep -q 'LIVE QA PREVIEW' /tmp/yorumachi-live-qa/index.html
          grep -q 'RELEASE CANDIDATE 03' /tmp/yorumachi-live-qa/index.html
          echo "PREVIEW_ARTIFACT=PASS"

      - name: Validate inline JavaScript
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/yorumachi-live-qa/index.html','utf8');
          const scripts=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          if(!scripts.length) throw new Error('inline script not found');
          fs.writeFileSync('/tmp/yorumachi-inline.js',scripts.join('\n'));
          console.log('INLINE_SCRIPT_COUNT='+scripts.length);
          NODE
          node --check /tmp/yorumachi-inline.js
          echo "SYNTAX_QA=PASS"

      - name: Verify temporary visual assets
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/yorumachi-live-qa/index.html','utf8');
          const urls=[...new Set(h.match(/https:\/\/files\.simplepost\.social\/[A-Za-z0-9_./-]+\.png/g) || [])];
          if(urls.length !== 9) throw new Error('expected 9 visual assets, got '+urls.length);
          fs.writeFileSync('/tmp/assets.txt', urls.join('\n')+'\n');
          console.log('REMOTE_VISUAL_ASSET_URLS='+urls.length);
          NODE
          while IFS= read -r url; do
            test -n "$url"
            curl --fail --location --silent --show-error --max-time 30 --range 0-31 "$url" -o /tmp/asset.bin
            test -s /tmp/asset.bin
          done < /tmp/assets.txt
          echo "REMOTE_VISUAL_ASSETS=9/9"

      - name: Ensure Cloudflare Pages preview project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -o /tmp/project-get.json -w '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")
          if [ "$code" = "200" ] && node -e "const p=require('/tmp/project-get.json');process.exit(p.success===true?0:1)"; then
            echo "PAGES_PROJECT=EXISTING"
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "{\"name\":\"$PROJECT_NAME\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              --output /tmp/project-create.json
            node -e "const p=require('/tmp/project-create.json');if(p.success!==true){console.error(p);process.exit(1)}"
            echo "PAGES_PROJECT=CREATED"
          fi

      - name: Deploy LIVE QA preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy /tmp/yorumachi-live-qa \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true

      - name: Direct live readback
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --location --silent --show-error --max-time 30 "$LIVE_URL" -o /tmp/live.html; then
              if grep -q 'LIVE QA PREVIEW' /tmp/live.html && grep -q 'RELEASE CANDIDATE 03' /tmp/live.html; then
                ok=1
                break
              fi
            fi
            sleep 8
          done
          test "$ok" = 1
          live_sha=$(sha256sum /tmp/live.html | awk '{print $1}')
          test "$live_sha" = "$EXPECTED_SHA256"
          echo "LIVE_URL=$LIVE_URL"
          echo "LIVE_SHA256=$live_sha"
          echo "LIVE_READBACK=PASS"

      - name: Live browser smoke - desktop and mobile
        run: |
          set -euo pipefail
          rm -rf /tmp/yorumachi-browser-qa
          mkdir -p /tmp/yorumachi-browser-qa
          cd /tmp/yorumachi-browser-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
          cat > smoke.cjs <<'NODE'
          const { chromium } = require('playwright');

          const liveUrl = process.env.LIVE_URL;
          if (!liveUrl) throw new Error('LIVE_URL missing');

          async function runCase(browser, name, options) {
            const context = await browser.newContext(options);
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e)));

            await page.goto(liveUrl, { waitUntil: 'networkidle', timeout: 60000 });

            const badge = await page.locator('#liveQaBadge').innerText();
            if (!badge.includes('LIVE QA PREVIEW')) throw new Error(name+': preview badge missing');

            const press = page.locator('#pressStart');
            if (!await press.isVisible()) throw new Error(name+': PRESS START not visible');
            await press.click();

            if (!await page.locator('#openingMovie').evaluate(el => el.classList.contains('hidden'))) {
              throw new Error(name+': opening did not close');
            }

            const start = page.locator('#startBtn');
            if (!await start.isVisible()) throw new Error(name+': start button not visible');
            await start.click();
            await page.waitForTimeout(500);

            if (!await page.locator('#intro').evaluate(el => el.classList.contains('hidden'))) {
              throw new Error(name+': intro did not close after start');
            }

            const canvas = page.locator('#town');
            if (!await canvas.isVisible()) throw new Error(name+': town canvas not visible');
            const size = await canvas.evaluate(el => ({w:el.width,h:el.height}));
            if (size.w !== 960 || size.h !== 600) throw new Error(name+': town canvas size mismatch');

            const mission = await page.locator('#missionProgress').innerText();
            if (!mission.trim()) throw new Error(name+': mission progress empty');

            const imageState = await page.evaluate(async () => {
              const urls=[...new Set(
                (document.documentElement.innerHTML.match(/https:\\/\\/files\\.simplepost\\.social\\/[A-Za-z0-9_./-]+\\.png/g) || [])
              )];
              const results=await Promise.all(urls.map(url => new Promise(resolve => {
                const img=new Image();
                img.onload=()=>resolve({url,ok:true,width:img.naturalWidth});
                img.onerror=()=>resolve({url,ok:false,width:0});
                img.src=url;
              })));
              return {urls,results};
            });
            if (imageState.urls.length !== 9) throw new Error(name+': expected 9 external asset URLs, got '+imageState.urls.length);
            const badImages = imageState.results.filter(x => !x.ok || x.width <= 0);
            if (badImages.length) throw new Error(name+': browser visual asset load failed '+JSON.stringify(badImages));

            if (consoleErrors.length) throw new Error(name+': console errors '+JSON.stringify(consoleErrors));
            if (pageErrors.length) throw new Error(name+': page errors '+JSON.stringify(pageErrors));

            await page.screenshot({path:`/tmp/yorumachi-browser-qa/${name}.png`, fullPage:true});
            console.log(name.toUpperCase()+'_BROWSER_SMOKE=PASS');
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              await runCase(browser, 'desktop', {
                viewport:{width:1280,height:900}
              });
              await runCase(browser, 'mobile', {
                viewport:{width:390,height:844},
                isMobile:true,
                hasTouch:true,
                deviceScaleFactor:1
              });
              console.log('LIVE_BROWSER_QA=PASS');
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node smoke.cjs
