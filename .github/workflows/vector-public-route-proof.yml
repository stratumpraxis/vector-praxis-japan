name: Vector Public Route Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vector-public-route-proof.yml'
      - 'app/ai-agent-bottleneck/**'
      - 'app/layout.tsx'
      - 'lib/site-url.ts'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: vector-public-route-proof
  cancel-in-progress: false

jobs:
  prove-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Vector public route candidates
        shell: bash
        run: |
          set -u
          mkdir -p distribution .route-proof
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = [
              "https://vector-praxis-japan.vercel.app/ai-agent-bottleneck",
              "https://vector-praxis-japan-hub.vercel.app/ai-agent-bottleneck",
          ]
          Path('.route-proof/candidates.json').write_text(json.dumps(candidates), encoding='utf-8')
          PY
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          content_marker = "AIを増やしても"
          candidates = json.loads(Path('.route-proof/candidates.json').read_text(encoding='utf-8'))
          rows = []
          for i, url in enumerate(candidates):
              body = Path(f'.route-proof/body-{i}.html')
              headers = Path(f'.route-proof/headers-{i}.txt')
              cmd = ['curl','-sS','-L','--connect-timeout','10','--max-time','25','-A','VectorRouteProof/4.0 (+https://github.com/stratumpraxis/vector-praxis-japan)','-D',str(headers),'-o',str(body),'-w','%{http_code}\t%{url_effective}',url]
              try:
                  proc = subprocess.run(cmd, text=True, capture_output=True, timeout=30)
                  parts = (proc.stdout or '').strip().split('\t', 1)
                  status = int(parts[0]) if parts and parts[0].isdigit() else 0
                  effective = parts[1] if len(parts) > 1 else None
                  text = body.read_text(encoding='utf-8', errors='ignore') if body.exists() else ''
                  text_l = text.lower()
                  header_text = headers.read_text(encoding='utf-8', errors='ignore') if headers.exists() else ''
                  csp_matches = re.findall(r'(?im)^content-security-policy:\s*(.+)$', header_text)
                  csp = csp_matches[-1].strip() if csp_matches else None
                  presence = {
                      'traffic_session_start': 'traffic_session_start' in text,
                      'posthog_reference': 'posthog' in text_l,
                      'posthog_ingestion_host': 'us.i.posthog.com' in text_l,
                      'vector_scope': 'vector_praxis_japan' in text,
                  }
                  rows.append({
                      'requested_url': url,
                      'effective_url': effective,
                      'http_status': status,
                      'content_marker_match': content_marker in text,
                      'analytics_marker_match': presence['traffic_session_start'] and presence['posthog_reference'],
                      'analytics_markers': presence,
                      'content_security_policy': csp,
                      'posthog_allowed_by_csp': None if not csp else ('us.i.posthog.com' in csp.lower() or '*.posthog.com' in csp.lower() or 'https:' in csp.lower() or 'connect-src *' in csp.lower()),
                      'curl_exit_code': proc.returncode,
                      'curl_error': (proc.stderr or '').strip()[:500] or None,
                  })
              except Exception as exc:
                  rows.append({'requested_url':url,'effective_url':None,'http_status':0,'content_marker_match':False,'analytics_marker_match':False,'analytics_markers':{},'content_security_policy':None,'posthog_allowed_by_csp':None,'curl_exit_code':None,'curl_error':str(exc)[:500]})
          Path('.route-proof/results.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Exercise live analytics with browser canary
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('.route-proof/results.json').read_text(encoding='utf-8'))
          passing = [r for r in results if r.get('http_status') == 200 and r.get('content_marker_match')]
          Path('.route-proof/selected-url.txt').write_text((passing[0].get('effective_url') or '') if passing else '', encoding='utf-8')
          PY
          BASE_URL="$(cat .route-proof/selected-url.txt)"
          if [ -z "$BASE_URL" ]; then
            printf '%s\n' '{"attempted":false,"reason":"no_reachable_route"}' > .route-proof/browser-canary.json
            exit 0
          fi
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            printf '%s\n' '{"attempted":false,"reason":"chrome_not_found"}' > .route-proof/browser-canary.json
            exit 0
          fi
          CANARY_URL="${BASE_URL}?route_id=vpj_measurement_canary_v1&asset_id=measurement_canary&utm_source=github_actions&utm_medium=measurement_canary&utm_campaign=vector_measurement_canary"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --log-net-log=.route-proof/netlog.json --net-log-capture-mode=Everything --dump-dom "$CANARY_URL" > .route-proof/canary-dom.html 2> .route-proof/canary-browser.err
          EXIT_CODE=$?
          export CHROME CANARY_URL EXIT_CODE
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          dom = Path('.route-proof/canary-dom.html').read_text(encoding='utf-8', errors='ignore') if Path('.route-proof/canary-dom.html').exists() else ''
          err = Path('.route-proof/canary-browser.err').read_text(encoding='utf-8', errors='ignore') if Path('.route-proof/canary-browser.err').exists() else ''
          net = Path('.route-proof/netlog.json').read_text(encoding='utf-8', errors='ignore') if Path('.route-proof/netlog.json').exists() else ''
          posthog_urls = sorted(set(re.findall(r'https://[^"\\ ]*posthog[^"\\ ]*', net)))[:20]
          evidence = {
              'attempted': True,
              'browser': os.environ.get('CHROME'),
              'canary_route_id': 'vpj_measurement_canary_v1',
              'canary_asset_id': 'measurement_canary',
              'url': os.environ.get('CANARY_URL'),
              'exit_code': int(os.environ.get('EXIT_CODE', '1')),
              'dom_has_content_marker': 'AIを増やしても' in dom,
              'network_has_posthog_host': 'us.i.posthog.com' in net,
              'network_has_posthog_assets': 'posthog.com/static/' in net or '-assets.i.posthog.com' in net,
              'network_has_ingest_path': '/i/v0/e/' in net or '/capture' in net,
              'posthog_url_samples': posthog_urls,
              'network_error_mentions': sorted(set(re.findall(r'ERR_[A-Z_]+', net + '\n' + err)))[:20],
              'stderr_tail': err[-500:] or None,
          }
          Path('.route-proof/browser-canary.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          exit 0

      - name: Write evidence state
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          results = json.loads(Path('.route-proof/results.json').read_text(encoding='utf-8'))
          canary = json.loads(Path('.route-proof/browser-canary.json').read_text(encoding='utf-8')) if Path('.route-proof/browser-canary.json').exists() else {'attempted': False, 'reason': 'missing_canary_evidence'}
          route_passing = [r for r in results if r['http_status'] == 200 and r['content_marker_match']]
          analytics_passing = [r for r in route_passing if r['analytics_marker_match'] and r['posthog_allowed_by_csp'] is not False]
          selected = route_passing[0]['effective_url'] if route_passing else None
          analytics_selected = analytics_passing[0]['effective_url'] if analytics_passing else None
          network_state = 'INGEST_REQUEST_SEEN' if canary.get('network_has_ingest_path') else ('POSTHOG_HOST_SEEN' if canary.get('network_has_posthog_host') else 'NO_POSTHOG_NETWORK_EVIDENCE')
          evidence = {
              'checked_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'commit_sha': os.environ.get('COMMIT_SHA'),
              'workflow_run_id': os.environ.get('RUN_ID'),
              'repository': os.environ.get('REPOSITORY'),
              'route_id': 'vpj_owned_ai_agent_bottleneck_v2',
              'asset_id': 'ai_agent_bottleneck',
              'content_marker': 'AIを増やしても',
              'analytics_marker': 'traffic_session_start + PostHog reference',
              'evidence_state': 'MEASUREMENT_SURFACE_REACHABLE' if analytics_selected else ('ROUTE_REACHABLE_ANALYTICS_UNVERIFIED' if selected else 'UNVERIFIED'),
              'measurement_network_state': network_state,
              'selected_url': selected,
              'analytics_selected_url': analytics_selected,
              'measurement_canary': canary,
              'candidates': results,
              'inference_guard': 'Synthetic canary traffic is excluded from qualified traffic. PostHog network evidence proves whether the live browser attempts SDK/assets/ingestion; PostHog query evidence is still required to prove ingestion completed.'
          }
          Path('distribution/vector-public-route-proof.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Persist route evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/vector-public-route-proof.json
          if git diff --cached --quiet; then
            echo "No public-route evidence change to persist."
            exit 0
          fi
          git commit -m "chore: persist Vector public route evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
